services:
  app:
    build:
      context: .
    image: spanwrap-blog-pipeline:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      PIPELINE_DATA_DIR: /app/.data
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - pipeline_data:/app/.data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pipeline_data:
