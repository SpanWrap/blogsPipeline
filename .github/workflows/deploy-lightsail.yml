name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build standalone release
        run: |
          npm run build
          mkdir -p release/.next release/public
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          if [ -d public ] && [ -n "$(ls -A public)" ]; then
            cp -a public/. release/public/
          fi
          cp ecosystem.config.cjs release/
          # Next can copy local dotenv files into standalone; never ship them.
          rm -f release/.env release/.env.*


      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightsail-release
          path: release
          include-hidden-files: true
          retention-days: 3

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
      LIGHTSAIL_ENV_FILE: ${{ secrets.LIGHTSAIL_ENV_FILE }}
      CONFIGURED_DEPLOY_PATH: ${{ vars.LIGHTSAIL_DEPLOY_PATH }}
    steps:
      - name: Resolve deploy path
        run: |
          if [[ -n "${CONFIGURED_DEPLOY_PATH}" ]]; then
            DEPLOY_PATH="${CONFIGURED_DEPLOY_PATH}"
          else
            DEPLOY_PATH="/home/${LIGHTSAIL_USER}/pipeline"
          fi

          if [[ "$DEPLOY_PATH" == *$'\n'* ]]; then
            echo "::error::LIGHTSAIL_DEPLOY_PATH must be a single filesystem path (for example /home/jai/pipeline). Put the .env contents in the LIGHTSAIL_ENV_FILE secret instead."
            exit 1
          fi

          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == *=* ]]; then
            echo "::error::LIGHTSAIL_DEPLOY_PATH must be an absolute path starting with /. Got: ${DEPLOY_PATH}"
            exit 1
          fi

          echo "DEPLOY_PATH=${DEPLOY_PATH}" >> "$GITHUB_ENV"
          echo "Using deploy path: ${DEPLOY_PATH}"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: lightsail-release
          path: release

      - name: Upload release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rsync
          REMOTE="${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}"
          SSH_ARGS=(-i ~/.ssh/lightsail -o IdentitiesOnly=yes -o ConnectTimeout=20)

          ssh "${SSH_ARGS[@]}" "$REMOTE" "mkdir -p '$DEPLOY_PATH' '$DEPLOY_PATH/.data'"

          rsync -az --delete \
            --exclude='.env' \
            --exclude='.data/' \
            -e "ssh -i ~/.ssh/lightsail -o IdentitiesOnly=yes -o ConnectTimeout=20" \
            ./release/ "$REMOTE:$DEPLOY_PATH/"

          if [[ -n "$LIGHTSAIL_ENV_FILE" ]]; then
            printf '%s' "$LIGHTSAIL_ENV_FILE" |
              ssh "${SSH_ARGS[@]}" "$REMOTE" "umask 077; cat > '$DEPLOY_PATH/.env'"
          fi

      - name: Restart with PM2
        run: |
          REMOTE="${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}"
          ssh -i ~/.ssh/lightsail -o IdentitiesOnly=yes "$REMOTE" bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          test -f server.js
          test -f .next/BUILD_ID
          test -f ecosystem.config.cjs
          test -s .env
          command -v pm2 >/dev/null
          mkdir -p .data
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          EOF
